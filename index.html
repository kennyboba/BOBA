<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  h1 {
    font-size: 1.8rem;
    color: #b3003c;
    margin-bottom: 40px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
    padding: 0 10px;
  }

  .buttons {
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-size: 1.3rem;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  #yesBtn {
    background: #ff4d79;
    color: white;
    position: relative;
    transition: all 0.15s ease;
  }

  #noBtn {
    background: white;
    color: #b3003c;
  }

  #noBtn:active { transform: scale(0.95); }

  #message {
    margin-top: 30px;
    font-size: 1.1rem;
    color: #b3003c;
    font-weight: bold;
    display: none;
    padding: 0 20px;
  }

  #playlist {
    margin-top: 25px;
    width: 100%;
    max-width: 480px;
    display: none;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 40px;
  }

  .song {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 4px 12px rgba(179, 0, 60, 0.15);
    text-align: left;
  }

  .song h3 {
    font-size: 1rem;
    color: #b3003c;
    margin-bottom: 10px;
    font-weight: bold;
  }

  .song iframe {
    width: 100%;
    height: 200px;
    border-radius: 10px;
    display: block;
  }

  .heart {
    position: absolute;
    font-size: 1.5rem;
    animation: float 6s infinite ease-in-out;
    opacity: 0.7;
    pointer-events: none;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(15deg); }
  }
</style>
</head>
<body>

  <span class="heart" style="top:5%; left:5%;">💖</span>
  <span class="heart" style="top:10%; right:5%; animation-delay:2s;">💕</span>
  <span class="heart" style="bottom:5%; left:10%; animation-delay:1s;">💗</span>
  <span class="heart" style="bottom:10%; right:10%; animation-delay:3s;">❤️</span>

  <h1>Do you want me to sing for you? 🎤</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <p id="message"></p>

  <!-- 🎵 PLAYLIST -->
  <div id="playlist">

    <!-- 1. Simi - Joromi -->
    <div class="song">
      <h3>💕 Joromi — Simi</h3>
      <iframe src="https://www.youtube.com/embed/s-DBy0YHpTQ"
              title="Simi - Joromi"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
    </div>

    <!-- 2. Adekunle Gold - Orente -->
    <div class="song">
      <h3>🌹 Orente — Adekunle Gold</h3>
      <iframe src="https://www.youtube.com/embed/rtTaAob5-1M"
              title="Adekunle Gold - Orente"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
    </div>

    <!-- 3. Chike ft. Simi - Running (To You) -->
    <div class="song">
      <h3>🏃 Running (To You) — Chike ft. Simi</h3>
      <iframe src="https://www.youtube.com/embed/Ds1sEErTB9I"
              title="Chike ft. Simi - Running To You"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
    </div>

    <!-- 4. Alhaji Sikiru Ayinde Barrister - Ife Bi Eji Owuro -->
    <div class="song">
      <h3>💫 Ife Bi Eji Owuro — Alhaji Sikiru Ayinde Barrister</h3>
      <iframe src="https://www.youtube.com/embed/CX4c2WnZCtY"
              title="Ife Bi Eji Owuro - Alhaji Sikiru Ayinde Barrister"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
    </div>

  </div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const message = document.getElementById('message');
  const playlist = document.getElementById('playlist');

  function runAway() {
    const maxX = window.innerWidth - yesBtn.offsetWidth - 20;
    const maxY = window.innerHeight - yesBtn.offsetHeight - 20;
    yesBtn.style.position = 'fixed';
    yesBtn.style.left = Math.random() * maxX + 'px';
    yesBtn.style.top = Math.random() * maxY + 'px';
  }

  yesBtn.addEventListener('mouseover', runAway);
  yesBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    runAway();
  });
  yesBtn.addEventListener('click', function(e) {
    e.preventDefault();
    runAway();
  });

  noBtn.addEventListener('click', function() {
    message.textContent = "Since you said no... here are songs straight from my heart 🎶💕";
    message.style.display = 'block';
    playlist.style.display = 'flex';
    noBtn.textContent = 'Okay fine 😌';
    yesBtn.style.display = 'none';
  });
</script>

</body>
</html>
